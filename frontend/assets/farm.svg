<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <title>Dairy Farm</title>
  <!-- Sky -->
  <rect x="0" y="0" width="200" height="120" fill="#bfe0f5"/>
  <!-- Sun -->
  <circle cx="165" cy="30" r="18" fill="#ffd966"/>
  <!-- Field -->
  <rect x="0" y="100" width="200" height="80" fill="#8fca63"/>
  <!-- Hill -->
  <ellipse cx="60" cy="115" rx="70" ry="35" fill="#7bb84f"/>
  <!-- Barn -->
  <rect x="40" y="70" width="55" height="40" fill="#c0503a" stroke="#8a3525" stroke-width="2"/>
  <polygon points="35,75 67,45 100,75" fill="#a0402f" stroke="#8a3525" stroke-width="2"/>
  <rect x="60" y="88" width="15" height="22" fill="#5a3520"/>
  <!-- Fence -->
  <line x1="10" y1="135" x2="190" y2="135" stroke="#8a5a2b" stroke-width="3"/>
  <rect x="25" y="118" width="5" height="22" fill="#8a5a2b"/>
  <rect x="55" y="118" width="5" height="22" fill="#8a5a2b"/>
  <rect x="85" y="118" width="5" height="22" fill="#8a5a2b"/>
  <rect x="115" y="118" width="5" height="22" fill="#8a5a2b"/>
  <rect x="145" y="118" width="5" height="22" fill="#8a5a2b"/>
  <rect x="175" y="118" width="5" height="22" fill="#8a5a2b"/>
  <!-- Grass tufts -->
  <path d="M110 150 Q115 140 120 150" fill="#6aa040" stroke="#6aa040" stroke-width="2"/>
  <path d="M150 158 Q155 148 160 158" fill="#6aa040" stroke="#6aa040" stroke-width="2"/>
</svg>