<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <title>Milk Can</title>
  <!-- Can body -->
  <rect x="30" y="55" width="100" height="130" rx="10" fill="#dfe9f3" stroke="#556677" stroke-width="3"/>
  <!-- Can lid -->
  <rect x="35" y="40" width="90" height="20" rx="5" fill="#c4d2e0" stroke="#556677" stroke-width="3"/>
  <!-- Handle -->
  <path d="M60 40 Q80 15 100 40" fill="none" stroke="#556677" stroke-width="4"/>
  <!-- Milk line -->
  <rect x="30" y="110" width="100" height="15" fill="#ffffff" stroke="#556677" stroke-width="1"/>
  <!-- Label text-ish shape -->
  <rect x="55" y="130" width="50" height="30" rx="5" fill="#ffffff" stroke="#556677" stroke-width="1"/>
  <!-- Steam -->
  <path d="M45 30 Q50 20 45 10" fill="none" stroke="#aabbcc" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 28 Q85 18 80 8" fill="none" stroke="#aabbcc" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 30 Q110 20 115 10" fill="none" stroke="#aabbcc" stroke-width="3" stroke-linecap="round"/>
</svg>